<!-- Barre supérieure -->
<header class="topbar">
  <button
    class="menu-button"
    type="button"
    aria-label="Ouvrir le menu"
    [attr.aria-expanded]="menuOuvert()"
    (click)="menuOuvert.set(true)"
  >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
  </button>

  <!-- Logo -->
  <div class="brand">
    <!-- Chapeau de graduation -->
<span class="brand-symbol" aria-hidden="true">
  <svg
    width="28"
    height="28"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m2 9 10-5 10 5-10 5-10-5Z" />
    <path d="M6 11v6c4 3 8 3 12 0v-6" />
    <path d="M22 9v7" />
  </svg>
</span>

    <span class="brand-name">KAAYNUJÀNG</span>
  </div>

  <div class="topbar-actions">
    <!-- Notifications -->
    <button
      class="notification-button"
      type="button"
      aria-label="Notifications"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path d="M10 21h4" />
      </svg>
    </button>

    <!-- Profil par défaut -->
    <span class="profile-avatar" role="img" aria-label="Profil utilisateur">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
      </svg>
    </span>
  </div>
</header>

@if (menuOuvert()) {
  <!-- Fond assombri -->
  <button
    class="menu-overlay"
    type="button"
    aria-label="Fermer le menu"
    (click)="menuOuvert.set(false)"
  ></button>

  <!-- Menu latéral -->
  <aside class="sidebar" aria-label="Menu principal">
    <div class="sidebar-header">
      <span>KAAYNUJÀNG</span>

      <button
        class="sidebar-close"
        type="button"
        aria-label="Fermer le menu"
        (click)="menuOuvert.set(false)"
      >
        <span aria-hidden="true">×</span>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Navigation apprenant">
      <p class="sidebar-group-title">Tableau de bord</p>

      <!-- Accueil -->
      <button
        class="sidebar-link sidebar-link-active"
        type="button"
        (click)="menuOuvert.set(false)"
      >
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m3 10 9-7 9 7" />
          <path d="M5 9v12h14V9" />
          <path d="M9 21v-8h6v8" />
        </svg>
        <span>Accueil</span>
      </button>

      <!-- Apprentissage -->
      <p class="sidebar-group-title">Apprentissage</p>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 5v15" />
          <path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z" />
        </svg>
        <span>Mes cours</span>
      </button>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        <span>Catalogue des cours</span>
      </button>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
          <path d="M14 2v6h6" />
          <path d="m8 15 3 3 5-6" />
        </svg>
        <span>Quiz et évaluations</span>
      </button>

      <!-- Suivi -->
      <p class="sidebar-group-title">Suivi</p>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 3v17h17" />
          <path d="M9 16v-5M14 16V7M19 16V4" />
        </svg>
        <span>Mes résultats</span>
      </button>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="6" />
          <path d="m8 13-1 9 5-3 5 3-1-9" />
        </svg>
        <span>Mes certificats</span>
      </button>

      <!-- Échanges -->
      <p class="sidebar-group-title">Échanges</p>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 11a8 8 0 0 1-8 8H7l-5 3V11a8 8 0 0 1 8-8h3a8 8 0 0 1 8 8Z" />
          <path d="M7 9h10M7 13h6" />
        </svg>
        <span>Forum</span>
      </button>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
          <path d="M10 21h4" />
        </svg>
        <span>Notifications</span>
      </button>

      <!-- Compte -->
      <p class="sidebar-group-title">Compte</p>

      <button class="sidebar-link" type="button" disabled>
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
        </svg>
        <span>Mon profil</span>
      </button>

      <button
        class="sidebar-link sidebar-logout"
        type="button"
        disabled
      >
        <svg
          class="sidebar-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M9 12h12" />
          <path d="m16 7 5 5-5 5" />
        </svg>
        <span>Déconnexion</span>
      </button>
    </nav>
  </aside>
}
<!-- Affichage de la page apprenant -->
<router-outlet></router-outlet>
