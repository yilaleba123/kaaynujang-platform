<section id="contact" class="contact-section">
  <div class="container grid-2">
    <!-- Formulaire de contact pour visiteurs -->
    <div class="contact-form-box">
      <h2>{{ 'CONTACT.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'CONTACT.SUBTITLE' | translate }}</p>

      <form (ngSubmit)="$event.preventDefault()">
        <div class="form-row">
          <div class="form-group">
            <label for="contact-name">{{ 'CONTACT.NAME' | translate }}</label>
            <input
              id="contact-name"
              type="text"
              class="form-control"
              placeholder="Votre nom"
              required
            />
          </div>
          <div class="form-group">
            <label for="contact-email">{{ 'CONTACT.EMAIL' | translate }}</label>
            <input
              id="contact-email"
              type="email"
              class="form-control"
              placeholder="votre@email.com"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="contact-category">{{ 'CONTACT.CATEGORY' | translate }}</label>
          <select id="contact-category" class="form-control">
            <option>Support technique</option>
            <option>Informations sur les cours</option>
            <option>Devenir partenaire / Centre de formation</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contact-message">{{ 'CONTACT.MESSAGE' | translate }}</label>
          <textarea
            id="contact-message"
            rows="4"
            class="form-control"
            placeholder="Comment pouvons-nous vous aider ?"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">{{ 'CONTACT.SEND' | translate }}</button>
      </form>

      <!-- Carte d'information de contact -->
      <div class="contact-info-card">
        <h4>Coordonnées</h4>
        <div class="info-list">
          <div class="info-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span>Dakar, Sénégal (Siège social)</span>
          </div>
          <div class="info-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <span>contact@kaaynujang.africa</span>
          </div>
          <div class="info-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
            <span>+221 77 000 00 00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Accordéon FAQ -->
    <div class="faq-box">
      <h2>{{ 'CONTACT.FAQ_TITLE' | translate }}</h2>
      <div class="accordion">
        <div class="faq-item" *ngFor="let faq of faqs; let i = index">
          <button
            class="faq-toggle"
            (click)="toggleFaq(i)"
            [attr.aria-expanded]="activeFaq === i"
            type="button"
          >
            <span>{{ faq.q }}</span>
            <svg
              class="chevron"
              [class.rotated]="activeFaq === i"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <div class="faq-content" *ngIf="activeFaq === i">
            <p>{{ faq.a }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
