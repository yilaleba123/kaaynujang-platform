<!-- Section Témoignages avec titre traduit -->
<section class="testimonials-section">
  <div class="container">
    <h2 class="text-center">{{ 'TESTIMONIALS.TITLE' | translate }}</h2>

    <!-- Grille de 3 cartes de témoignages -->
    <div class="grid-3">
      <div class="testimonial-card" *ngFor="let t of testimonials">
        <!-- Contenu de la citation avec icône SVG Guillemet vert -->
        <div class="quote-header">
          <p class="quote-text">"{{ t.quote }}"</p>
          <svg class="quote-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"
            />
          </svg>
        </div>

        <!-- Auteur du témoignage -->
        <div class="author">
          <div class="author-name">{{ t.name }}</div>
          <div class="author-role">{{ t.role }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
