<!-- Backdrop Mobile -->
<div
  *ngIf="isMobile && mobileOpen"
  class="mobile-backdrop"
  (click)="closeMobile.emit()"
  aria-hidden="true"
></div>

<aside
  class="sidebar-container"
  [class.collapsed]="collapsed && !isMobile"
  [class.mobile-drawer]="isMobile"
  [class.mobile-open]="isMobile && mobileOpen"
>
  <!-- Header Logo : SVG Chapeau -->
  <div class="sidebar-logo-header">
    <div class="logo-hat-box">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
        <path d="M6 12v5c3 3 9 3 12 0v-5" />
      </svg>
    </div>
    <span class="brand-title" *ngIf="!collapsed || isMobile">KAAYNUJÀNG</span>

    <button
      *ngIf="isMobile"
      (click)="closeMobile.emit()"
      class="btn-close-mobile"
      aria-label="Fermer le menu"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 6L6 18 M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div *ngFor="let section of navSections" class="nav-section-group">
      <p class="section-heading" *ngIf="!collapsed || isMobile">{{ section.title }}</p>
      <div class="section-divider" *ngIf="collapsed && !isMobile"></div>

      <ul class="nav-items-list">
        <li *ngFor="let item of section.items">
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard/admin' }"
            (click)="onNavClick()"
            class="nav-item-link"
            [title]="collapsed && !isMobile ? item.label : ''"
          >
            <svg
              class="nav-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path [attr.d]="item.iconSvg" />
            </svg>

            <span class="nav-label" *ngIf="!collapsed || isMobile">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Déconnexion -->
  <div class="sidebar-logout-wrapper">
    <button
      (click)="logout()"
      class="btn-logout"
      [title]="collapsed && !isMobile ? 'Déconnexion' : ''"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9" />
      </svg>
      <span *ngIf="!collapsed || isMobile">Déconnexion</span>
    </button>
  </div>

  <!-- Profil Administrateur -->
  <div class="sidebar-user-footer" [title]="collapsed && !isMobile ? 'Administrateur' : ''">
    <div class="user-avatar-circle">
      {{ currentUser?.first_name?.charAt(0) || currentUser?.username?.charAt(0) || 'A' }}
    </div>
    <div class="user-text-details" *ngIf="!collapsed || isMobile">
      <p class="user-display-name">
        {{
          currentUser?.first_name
            ? currentUser?.first_name + ' ' + currentUser?.last_name
            : currentUser?.username || 'Administrateur'
        }}
      </p>
      <p class="user-role-subtitle">Super administrateur</p>
    </div>
  </div>
</aside>
