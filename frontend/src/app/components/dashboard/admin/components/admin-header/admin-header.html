<header class="topbar-container">
  <!-- Hamburger Button -->
  <button
    type="button"
    class="btn-hamburger"
    (click)="toggleHamburger.emit()"
    aria-label="Basculer la navigation"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
    >
      <path d="M3 12h18 M3 6h18 M3 18h18" />
    </svg>
  </button>

  <div class="topbar-spacer"></div>

  <!-- Notifications Bell & Dropdown Wrapper -->
  <div class="notif-dropdown-wrapper">
    <button
      type="button"
      class="btn-bell"
      (click)="toggleNotif()"
      [attr.aria-label]="notifCount + ' notifications'"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 01-3.46 0" />
      </svg>
      <span class="badge-notif" *ngIf="notifCount > 0">{{ notifCount }}</span>
    </button>

    <!-- Panneau Déroulant de Notifications -->
    <div class="notifications-dropdown" *ngIf="notifOpen">
      <div class="dropdown-header">
        <div>
          <h2 class="dropdown-title">Notifications</h2>
          <p class="unread-subtitle">{{ notifCount }} non lue(s)</p>
        </div>
        <button type="button" class="btn-close-dropdown" (click)="toggleNotif()">✕</button>
      </div>

      <div class="dropdown-subheader">
        <span class="recent-label">RÉCENTES</span>
        <button type="button" class="btn-mark-all" (click)="markAllRead()">
          Tout marquer comme lu
        </button>
      </div>

      <div class="dropdown-body">
        <div *ngIf="notifications.length === 0" class="empty-dropdown">
          <p>Aucune notification récente.</p>
        </div>

        <div
          *ngFor="let item of notifications.slice(0, 5)"
          class="notif-item"
          [class.unread]="!item.est_lue"
          (click)="onNotificationClick(item)"
        >
          <div class="item-icon" [class]="item.type.toLowerCase()">
            <ng-container [ngSwitch]="item.type">
              <svg
                *ngSwitchCase="'COURSE'"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <svg
                *ngSwitchCase="'FORUM'"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <svg
                *ngSwitchCase="'USER'"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              <svg
                *ngSwitchDefault
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
            </ng-container>
          </div>

          <div class="item-content">
            <div class="item-header-row">
              <p class="item-title">{{ item.titre }}</p>
              <span class="dot-unread" *ngIf="!item.est_lue"></span>
            </div>
            <p class="item-message">{{ item.message }}</p>
            <span class="item-time">{{ item.created_at }}</span>
          </div>
        </div>
      </div>

      <div class="dropdown-footer">
        <button type="button" class="btn-view-all" (click)="goToAllNotifications()">
          Voir toutes les notifications →
        </button>
      </div>
    </div>
  </div>

  <!-- User Avatar Dropdown -->
  <div class="avatar-dropdown-wrapper">
    <button type="button" class="btn-avatar" (click)="toggleAvatar()">
      <div class="avatar-circle">
        {{ currentUser?.first_name?.charAt(0) || currentUser?.username?.charAt(0) || 'A' }}
      </div>
    </button>

    <div class="dropdown-menu" *ngIf="avatarOpen">
      <div class="dropdown-header">
        <p class="user-name">{{ currentUser?.username || 'Administrateur' }}</p>
        <p class="user-email">{{ currentUser?.email || 'admin@kaaynujang.sn' }}</p>
      </div>
      <button class="menu-item" (click)="logout()">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
        >
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9" />
        </svg>
        Déconnexion
      </button>
    </div>
  </div>
</header>

<!-- Breadcrumb Bar -->
<div class="breadcrumb-bar">
  <span class="brand-text">KAAYNUJÀNG</span>
  <svg
    class="chevron-icon"
    width="12"
    height="12"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <path d="M9 18l6-6-6-6" />
  </svg>
  <span class="page-title-text">{{ currentPageTitle }}</span>
</div>
