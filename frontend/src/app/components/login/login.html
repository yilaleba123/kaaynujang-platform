<div class="login-page">
  <div class="login-card">
    <!-- En-tête -->
    <div class="card-header">
      <h1 class="brand-title">KAAYNUJÀNG</h1>
      <p class="brand-subtitle">Portail de connexion</p>
    </div>

    <!-- Formulaire -->
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Alerte Erreur -->
        <div *ngIf="errorMessage" class="error-alert" role="alert">
          <svg class="icon-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Champ Adresse e-mail -->
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control"
            placeholder="nom@exemple.com"
            aria-required="true"
          />
        </div>

        <!-- Champ Mot de passe -->
        <div class="form-group">
          <div class="label-row">
            <label for="password">Mot de passe</label>
            <a routerLink="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="form-control"
            placeholder="••••••••"
            aria-required="true"
          />
          <p class="security-note">
            <svg class="icon-lock" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
            Ne partagez jamais votre mot de passe
          </p>
        </div>

        <!-- Bouton de soumission -->
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </button>
      </form>
    </div>
  </div>
</div>
