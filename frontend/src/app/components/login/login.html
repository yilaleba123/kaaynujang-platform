<p>login works!</p>
<div
  style="
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
  "
>
  <h2>Connexion KAAYNUJÀNG</h2>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px">
      <label>Nom d'utilisateur :</label>
      <input
        type="text"
        [(ngModel)]="credentials.username"
        name="username"
        required
        style="width: 100%; padding: 8px"
      />
    </div>

    <div style="margin-bottom: 15px">
      <label>Mot de passe :</label>
      <input
        type="password"
        [(ngModel)]="credentials.password"
        name="password"
        required
        style="width: 100%; padding: 8px"
      />
    </div>

    <button
      type="submit"
      style="
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
      "
    >
      Se connecter
    </button>
  </form>

  <p *ngIf="errorMessage" style="color: red; margin-top: 10px">{{ errorMessage }}</p>
</div>
