<header class="h-16 bg-blue-950 border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-20 shrink-0 sticky top-0">
    <div class="flex items-center gap-4">

        <button
            type="button"
            class="p-2 -ml-2 text-gray-100 hover:text-blue-500 hover:bg-gray-100 focus:ring-2 focus:ring-inset focus:ring-blue-500 rounded-lg"
            (click)="toggleSidebar()"
            aria-label="Ouvrir le menu"
        >
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="flex items-center gap-2">
            <a routerLink="/" class="flex items-center gap-2">
                <!--<img src="assets/images/logo.png" alt="Logo" class="h-8 w-auto" />-->
                <span><svg 
                xmlns="http://w3.org" 
                width="24" 
                height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="#22c55e" 
                stroke-width="2" 
                stroke-linecap="round" 
                stroke-linejoin="round"
                >
                <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
                <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                </svg>
                </span>
                <span class="text-white font-bold text-lg">KaynuJank</span>
            </a>
        </div> 
    </div>

    <div class="flex items-center gap-3 sm:gap-5">
            <button
                type="button"
                class="relative p-2 text-gray-100 hover:text-blue-500 hover:bg-gray-100 focus:ring-2 focus:ring-blue-500 rounded-full"
                aria-label="Notifications"
            >
            <a routerLink="/formateur/notification">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-white"></span>
            </a>
            </button>
            <div class="relative">
                <button 
                    type="button"
                    class="flex items-center gap-2 p-1 text-gray-100 hover:text-blue-500 hover:bg-gray-100 focus:ring-2 rounded-full"
                    (click)="toggleUserMenu()"
                    aria-label="Menu utilisateur"
                >
                    <div>
                        <img src="assets/images/user-avatar.png" alt="Avatar utilisateur" class="h-8 w-8 rounded-full" />
                    </div>
                </button>
                    
            </div>
    </div>

</header>

@if (isSidebarOpen()) {

    <aside class="fixed inset-y-0 left-0 z-20 w-64 bg-white shadow-lg overflow-y-auto transition-transform transform -translate-x-full md:translate-x-0" [class.translate-x-0]="isSidebarOpen()">
        <div>
        <a routerLink="/" class="flex items-center gap-2 p-4 border-b border-gray-200">
            <!--<img src="assets/images/logo.png" alt="Logo" class="h-8 w-auto" />-->
            <span><svg 
                xmlns="http://w3.org" 
                width="24" 
                height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="#22c55e" 
                stroke-width="2" 
                stroke-linecap="round" 
                stroke-linejoin="round"
                >
                <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
                <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                </svg>
            </span>
            <span class="text-gray-950 font-bold text-lg">KaynuJank</span>
        </a>
        <button
            type="button"
            class="absolute top-4 right-4 p-2 text-gray-950 hover:text-blue-500 hover:bg-gray-100 focus:ring-2 focus:ring-inset focus:ring-blue-500 rounded-lg"
            (click)="closeSidebar()"
            aria-label="Fermer le menu"
        >
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        </div>
        <div class="p-4">
            <nav class="space-y-2">
                <small class="text-sm text-gray-600 px-4 py-1">TABLEAU DE BORD</small>
                <a routerLink="/formateur/dashboard" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Accueil</a>
                <small class="text-sm text-gray-600 px-4 py-1">MES CONTENUS</small>
                <a routerLink="/formateur/mes-cours" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Mes cours</a>
                <a routerLink="/formateur/creer-cours" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Créer un cours</a>
                <a routerLink="/formateur/documents" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Documents</a>
                <small class="text-sm text-gray-600 px-4 py-1">ÉVALUATIONS</small>                
                <a routerLink="/formateur/quiz" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Mes quiz</a>
                <a routerLink="/formateur/corrections" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Copie à corriger</a>
                <small class="text-sm text-gray-600 px-4 py-1">SUIVI</small>  
                <a routerLink="/formateur/apprenants" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Mes Apprenants</a>
                <a routerLink="/formateur/statistique" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Statistiques</a>
                <small class="text-sm text-gray-600 px-4 py-1">ÉCHANGES</small> 
                <a routerLink="/formateur/notification" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Forum</a>
                <a routerLink="/formateur/notification" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Notifications</a>
                <small class="text-sm text-gray-600 px-4 py-1">COMPTE</small>  
                <a routerLink="/formateur/profile" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Mon profil</a>
                <a routerLink="logout" class="block px-4 py-2 text-gray-950 hover:bg-gray-100 rounded">Déconnexion</a>
            </nav>
        </div>
    </aside>
}

@if (isUserMenuOpen()) {
    <div class="fixed inset-0 z-10" (click)="closeUserMenu()"></div>
    <div class="absolute right-4 mt-2 w-48 bg-white border border-gray-200 rounded shadow-lg z-20">
        <a routerLink="/formateur/profile" class="block px-4 py-2 text-gray-950 hover:bg-gray-100">Mon profil</a>
        <a routerLink="/logout" class="block px-4 py-2 text-gray-950 hover:bg-gray-100">Déconnexion</a>
    </div>
}
