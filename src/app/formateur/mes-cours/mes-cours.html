<!-- Page pour les cours du formateur -->

<div class="flex flex-col min-h-screen bg-gray-100">
    <div class="p-4 mt-4 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
            <h1 class="text-2xl font-semibold text-blue-950">
                Mes cours
            </h1>
            <p class="text-gray-600 dark:text-gray-400">
                Voici la liste de vos cours.
            </p>
        </div>

        <button
                type="button"
                class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none "
                (click)="goToCreateCourse()"
            >
                Créer un cours
        </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-4 p-4">
        <div class="bg-white p-4 rounded-lg shadow-md">
            <p class="text-gray-600 dark:text-gray-400">Cours publiés</p>
            <p>{{ coursPublies }}</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-md">
            <p class="text-gray-600 dark:text-gray-400">Cours en brouillon</p>
            <p>{{ coursBrouillon }}</p>
        </div>
    </div>

    <div class="mt-4 p-4 bg-white rounded-lg shadow-md">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold text-blue-950">Liste des cours</h2>
            <div class="flex items-center gap-2">
                <input
                    type="text"
                    placeholder="Rechercher un cours..."
                    (input)="filterCourses()"
                    (keyup.enter)="filterCourses()"
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
                <button class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Filtrer
                </button>
            </div>
        </div>

        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
               @for (cours of filteredCourses(); track cours.id) {
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">{{ cours.titre }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ cours.statut }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button
                            type="button"
                            class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 focus:outline-none"
                            (click)="goToEditCourse(cours.id)"
                        >
                            Modifier
                        </button>
                        <button
                            type="button"
                            class="ml-2 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 focus:outline-none"
                            (click)="deleteCourse(cours.id)"
                        >
                            Supprimer
                        </button>
                    </td>
                </tr>
               } @empty {
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-gray-500">Aucun cours trouvé.</td>
                </tr>
               }
            </tbody>
        </table>
    </div>
</div>
