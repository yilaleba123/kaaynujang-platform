<!--Page de création de cours-->

<div class="flex flex-col min-h-screen bg-gray-100">
    <div class="p-4 mt-4 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
            <h1 class="text-2xl font-semibold text-blue-950">
                Créer un cours
            </h1>
            <p class="text-gray-600 dark:text-gray-400">
                Remplissez les informations ci-dessous pour créer un nouveau cours.
            </p>
        </div>
    </div>

    <div class="mt-4 p-4 bg-white rounded-lg shadow-md">
        <form (ngSubmit)="creeCourse()">
            <div class="mb-4">
                <label for="titre" class="block text-gray-700 font-semibold mb-2">Titre du cours</label>
                <input
                    type="text"
                    id="titre"
                    [(ngModel)]="cours.titre"
                    name="titre"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
            </div>

            <div class="mb-4">
                <label for="description" class="block text-gray-700 font-semibold mb-2">Description</label>
                <textarea
                    id="description"
                    [(ngModel)]="cours.description"
                    name="description"
                    required
                    rows="4"
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                ></textarea>
            </div>

            <div class="mb-4">
                <label for="document" class="block text-gray-700 font-semibold mb-2">Document</label>
                <input
                    type="file"
                    id="document"
                    [(ngModel)]="cours.document"
                    name="document"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                />
            </div>

            <button
                type="submit"
                class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none"
            >
                Créer le cours
            </button>
        </form>
    </div>
</div>
